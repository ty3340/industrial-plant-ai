services:
  simulator:
    build: ./backend
    command: python data/simulator/opcua_server.py
    environment:
      OPC_SERVER_URL: opc.tcp://0.0.0.0:26543/BatchPlantServer
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',26543),2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    build: ./backend
    command: python mcp_server/batch_plant_functions.py
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      OPC_SERVER_URL: opc.tcp://simulator:26543/BatchPlantServer
    depends_on:
      simulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost',8000),2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    command: sh -c "python data/static_data/seed_data.py && python -m agents.maintenance.ingest && uvicorn app.main:app --host 0.0.0.0 --port 8001"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your .env}
      LLM_MODEL: ${LLM_MODEL:-openai:gpt-4.1}
      OPC_SERVER_URL: opc.tcp://simulator:26543/BatchPlantServer
      BATCH_PLANT_MCP_URL: http://mcp:8000/mcp
      QUERY_TIMEOUT_S: ${QUERY_TIMEOUT_S:-180}
    ports:
      - "8001:8001"
    depends_on:
      mcp:
        condition: service_healthy
      simulator:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
